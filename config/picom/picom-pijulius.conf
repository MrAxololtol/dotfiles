#################################
#        FROSTED GLASS PICOM
#################################

# Backend
backend = "glx";
vsync = true;

# =================================
# Shadows
# =================================

shadow = true;
shadow-radius = 18;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.45;

shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'i3bar'",
    "class_g = 'mochi'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# =================================
# Fading
# =================================

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# The pet manages its own transparency and hides over fullscreen; never fade it.
fade-exclude = [ "class_g = 'mochi'" ];

# =================================
# Transparency
# =================================

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Kitty transparency
opacity-rule = [
    "82:class_g = 'kitty'",
    "88:class_g = 'Polybar'",
    "88:class_g = 'polybar'"
];

# =================================
# Blur
# =================================

blur-method = "dual_kawase";
blur-strength = 8;

blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

blur-kern = "3x3box";

# Don't blur normal opaque windows
blur-background-exclude = [
    "class_g = 'Firefox'",
    "class_g = 'firefox'",
    "class_g = 'Chromium'",
    "class_g = 'chromium'",
    "class_g = 'Steam'",
    "class_g = 'steam'",
    "class_g = 'mochi'",
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "window_type = 'tooltip'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'"
];

# =================================
# Rounded corners
# =================================

corner-radius = 12;

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'polybar'",
    "class_g = 'mochi'"
];

# =================================
# General
# =================================

mark-wmwin-focused = true;
mark-ovredir-focused = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

use-ewmh-active-win = true;

# =================================
# Performance
# =================================

use-damage = true;

# =================================
# Animations
# =================================

animations = ({
    # Hyprland-style popin on open
    triggers = ["open", "show"];
    preset = "appear";
    duration = 0.25;
    scale = 0.85;
}, {
    triggers = ["close", "hide"];
    preset = "disappear";
    duration = 0.2;
    scale = 0.85;
}, {
    # Workspace switching
    triggers = ["workspace-out"];
    preset = "slide-out";
    duration = 0.25;
    direction = "left";
}, {
    triggers = ["workspace-out-inverse"];
    preset = "slide-out";
    duration = 0.25;
    direction = "right";
}, {
    triggers = ["workspace-in"];
    preset = "slide-in";
    duration = 0.25;
    direction = "right";
}, {
    triggers = ["workspace-in-inverse"];
    preset = "slide-in";
    duration = 0.25;
    direction = "left";
}, {
    # Animate window moves/resizes (bspwm tiling)
    triggers = ["geometry"];
    preset = "geometry-change";
    duration = 0.2;
});

# =================================
# Window types
# =================================

wintypes:
{
    tooltip = {
        fade = true;
        shadow = true;
        opacity = 0.95;
        focus = true;
        full-shadow = false;
    };

    dock = {
        shadow = false;
        blur-background = true;
    };

    dnd = {
        shadow = false;
    };

    popup_menu = {
        opacity = 0.95;
        shadow = true;
        fade = true;
    };

    dropdown_menu = {
        opacity = 0.95;
        shadow = true;
        fade = true;
    };

    combo = {
        shadow = true;
    };

    desktop = {
        shadow = false;
        blur-background = false;
    };
};
