[dmenu]
dmenu_command = ~/.config/networkmanager-dmenu/rofi
active_chars = ==
highlight = True
highlight_fg =
highlight_bg =
highlight_bold = True
compact = True
pinentry =
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {name}  ·  {sec}  ·  {signal}%%
list_saved = False
prompt = Networks

[dmenu_passphrase]
obscure = False
obscure_color = #222222

[pinentry]
description = Get network password
prompt = Password:

[editor]
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
notification_timeout = 5
show_notifications = True
